<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1600 980" role="img" aria-labelledby="title description">
  <title id="title">Arquitectura del Reto 1: vivienda juvenil en Euskadi</title>
  <desc id="description">Fuentes de vivienda, renta municipal Eustat y remuneración juvenil regional procesadas con Python, originales y procesados en zonas separadas de HDFS, carga canónica en MongoDB, replay por Kafka y análisis PyMongo.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#52657a"/>
    </marker>
    <style>
      text{font-family:Segoe UI,Arial,sans-serif;fill:#162638}
      .title{font-size:30px;font-weight:700}
      .subtitle{font-size:15px;fill:#52657a}
      .heading{font-size:19px;font-weight:700}
      .body{font-size:15px}
      .small{font-size:13px;fill:#40566c}
      .box{stroke-width:2;rx:12}
      .flow{fill:none;stroke:#52657a;stroke-width:3;marker-end:url(#arrow)}
      .optional{fill:none;stroke:#74879a;stroke-width:2;stroke-dasharray:8 7;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="980" fill="#f3f6fa"/>
  <text x="50" y="52" class="title">¿Dónde pueden vivir los jóvenes en Euskadi?</text>
  <text x="50" y="80" class="subtitle">Arquitectura observada · Fases 2–6 · actualización 12-11-2026</text>

  <text x="45" y="119" class="heading">Fuentes reales</text>
  <rect x="45" y="137" width="260" height="82" class="box" fill="#e8f1fb" stroke="#6792bf"/>
  <text x="65" y="166" class="heading">Fotocasa</text>
  <text x="65" y="190" class="body">HTML histórico → 41.164 filas</text>
  <text x="65" y="210" class="small">251 municipios · 2020–2026</text>

  <rect x="45" y="235" width="260" height="82" class="box" fill="#e8f1fb" stroke="#6792bf"/>
  <text x="65" y="264" class="heading">Pisos.com</text>
  <text x="65" y="288" class="body">Scraper web → 1.041 anuncios</text>
  <text x="65" y="308" class="small">Venta y alquiler; anuncios individuales</text>

  <rect x="45" y="333" width="260" height="82" class="box" fill="#eaf5ee" stroke="#6b9a7a"/>
  <text x="65" y="362" class="heading">EMAL</text>
  <text x="65" y="386" class="body">XLSX → alquiler registrado</text>
  <text x="65" y="406" class="small">Anual y vigente, en subconjuntos</text>

  <rect x="45" y="431" width="260" height="82" class="box" fill="#eaf5ee" stroke="#6b9a7a"/>
  <text x="65" y="460" class="heading">Eustat</text>
  <text x="65" y="484" class="body">API / JSON → renta personal</text>
  <text x="65" y="504" class="small">Edad regional; municipios sin edad</text>

  <rect x="45" y="529" width="260" height="82" class="box" fill="#eaf5ee" stroke="#6b9a7a"/>
  <text x="65" y="558" class="heading">Etxebide</text>
  <text x="65" y="582" class="body">CSV → fotografías de demanda VPO</text>
  <text x="65" y="602" class="small">Valores suprimidos conservados</text>
  <rect x="45" y="615" width="260" height="38" class="box" fill="#eaf5ee" stroke="#6b9a7a"/>
  <text x="58" y="640" class="small">RemuMedia + IOVJ · remuneración regional</text>

  <rect x="370" y="275" width="300" height="188" class="box" fill="#fff4dd" stroke="#c69b42"/>
  <text x="395" y="310" class="heading">Python · preparación</text>
  <text x="395" y="342" class="body">Validar · normalizar · tipar</text>
  <text x="395" y="370" class="body">Códigos municipales como texto</text>
  <text x="395" y="398" class="body">Trazabilidad y upsert idempotente</text>
  <text x="395" y="434" class="small">Scripts específicos por fuente</text>

  <rect x="765" y="135" width="315" height="150" class="box" fill="#eee9fa" stroke="#8a73b5"/>
  <text x="790" y="171" class="heading">HDFS · originales + procesados</text>
  <text x="790" y="202" class="body">/user/iabd-user11/reto1/</text>
  <text x="790" y="230" class="body">290 archivos · 341.468.251 bytes</text>
  <text x="790" y="260" class="small">21 procesados · SHA-256 verificado</text>

  <rect x="765" y="335" width="365" height="228" class="box" fill="#e4f4f2" stroke="#4c9990"/>
  <text x="790" y="371" class="heading">MongoDB · reto_vivienda_fase3</text>
  <text x="790" y="405" class="body">municipios · precios_fotocasa</text>
  <text x="790" y="433" class="body">anuncios_pisoscom · alquiler_emal</text>
  <text x="790" y="461" class="body">renta_personal_eustat · demanda_vpo</text>
  <text x="790" y="495" class="small">6 colecciones canónicas · 306.711 documentos</text>
  <text x="790" y="525" class="small">Relación por municipio_codigo</text>

  <rect x="1220" y="335" width="330" height="185" class="box" fill="#e9eef8" stroke="#748ba8"/>
  <text x="1245" y="371" class="heading">PyMongo · análisis</text>
  <text x="1245" y="405" class="body">5 consultas · 3 pipelines</text>
  <text x="1245" y="433" class="body">Filtros · $group · $lookup</text>
  <text x="1245" y="461" class="small">Índice contrastado con explain()</text>
  <text x="1245" y="490" class="small">Regional y municipal EMAL/Eustat · 2024</text>

  <rect x="765" y="580" width="365" height="60" class="box" fill="#e4f4f2" stroke="#4c9990"/>
  <text x="790" y="606" class="heading">MongoDB · reto_vivienda</text>
  <text x="790" y="629" class="small">RemuMedia e IOVJ · referencia regional</text>

  <rect x="1220" y="540" width="330" height="100" class="box" fill="#e9eef8" stroke="#748ba8"/>
  <text x="1245" y="577" class="heading">Resultados Fase 6</text>
  <text x="1245" y="608" class="body">CSV · JSON · 7 SVG · informe HTML</text>
  <text x="1245" y="630" class="small">resultados/fase6/</text>

  <path d="M305 177 C335 177 340 310 370 320" class="flow"/>
  <path d="M305 275 C335 275 340 340 370 345" class="flow"/>
  <path d="M305 373 C335 373 340 370 370 370" class="flow"/>
  <path d="M305 471 C335 471 340 400 370 395" class="flow"/>
  <path d="M305 569 C335 569 340 425 370 420" class="flow"/>
  <path d="M305 634 C335 634 340 450 370 450" class="flow"/>
  <path d="M670 400 C720 420 725 445 765 445" class="flow"/>
  <path d="M670 435 C720 460 725 585 765 605" class="flow"/>
  <path d="M305 175 C450 100 610 100 765 175" class="flow"/>
  <text x="500" y="115" class="small">ficheros originales</text>
  <path d="M1130 445 L1220 405" class="flow"/>
  <path d="M1130 610 L1220 490" class="flow"/>
  <path d="M1385 520 L1385 540" class="flow"/>

  <text x="45" y="667" class="heading">Replay histórico de anuncios · Fase 5</text>
  <rect x="45" y="696" width="250" height="108" class="box" fill="#eee9fa" stroke="#8a73b5"/>
  <text x="68" y="733" class="heading">CSV en HDFS</text>
  <text x="68" y="765" class="body">originales/pisos/</text>
  <text x="68" y="789" class="small">pisos_euskadi.csv</text>

  <rect x="365" y="696" width="245" height="108" class="box" fill="#fff4dd" stroke="#c69b42"/>
  <text x="390" y="733" class="heading">Productor Python</text>
  <text x="390" y="765" class="body">JSON · 1.041 eventos</text>
  <text x="390" y="789" class="small">event_id determinista</text>

  <rect x="680" y="696" width="270" height="108" class="box" fill="#fff0e8" stroke="#c98762"/>
  <text x="705" y="733" class="heading">Kafka</text>
  <text x="705" y="765" class="body">reto1_anuncios_iabd-user11</text>
  <text x="705" y="789" class="small">tópico · 1 partición</text>

  <rect x="1020" y="696" width="245" height="108" class="box" fill="#fff4dd" stroke="#c69b42"/>
  <text x="1045" y="733" class="heading">Consumidor Python</text>
  <text x="1045" y="765" class="body">Valida y hace upsert</text>
  <text x="1045" y="789" class="small">Replay, no anuncios nuevos</text>

  <rect x="1325" y="696" width="225" height="108" class="box" fill="#e4f4f2" stroke="#4c9990"/>
  <text x="1345" y="733" class="heading">MongoDB</text>
  <text x="1345" y="765" class="body">anuncios_stream_fase5</text>
  <text x="1345" y="789" class="small">colección separada</text>

  <path d="M295 750 L365 750" class="flow"/>
  <path d="M610 750 L680 750" class="flow"/>
  <path d="M950 750 L1020 750" class="flow"/>
  <path d="M1265 750 L1325 750" class="flow"/>
  <path d="M765 285 L730 285 L730 625 L170 625 L170 696" class="flow"/>

  <rect x="45" y="850" width="1505" height="76" rx="10" fill="#fff5f4" stroke="#c87570" stroke-width="2"/>
  <text x="68" y="881" class="heading">Brechas identificadas frente al nivel máximo del PDF</text>
  <text x="68" y="908" class="body">No hay renta juvenil municipal verificada; API Eustat estadística, no de precios. Fotocasa repite series entre códigos.</text>
</svg>
